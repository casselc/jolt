name: tests

# Run the gate (make test) on every push and pull request. Chez is the sole
# substrate; the JVM is used only as the conformance oracle (certify).
on:
  push:
  pull_request:

jobs:
  test:
    name: full gate (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive   # vendor/irregex, used by the Chez regex shim

      # Build Chez from source rather than the distro package: the apt
      # chezscheme ships petite+scheme only, with no kernel dev files
      # (libkernel.a, scheme.h), so `jolt build` (the buildsmoke gate) can't link
      # a binary and would skip. The source build provides them, plus the libs the
      # kernel links against.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git liblz4-dev zlib1g-dev libncurses-dev uuid-dev

      - name: Cache Chez Scheme
        id: cache-chez
        uses: actions/cache@v4
        with:
          path: /opt/chez
          key: chez-${{ matrix.runner }}-${{ runner.arch }}-v10.4.1-x11off

      - name: Build Chez Scheme from source
        if: steps.cache-chez.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v10.4.1 https://github.com/cisco/ChezScheme.git /tmp/chez-src
          cd /tmp/chez-src
          # --disable-x11: the expression editor's X11 clipboard isn't needed and
          # would pull an X11 build/link dep.
          ./configure --installprefix=/opt/chez --threads --disable-x11
          make -j"$(nproc)"
          sudo make install
          sudo chown -R "$USER" /opt/chez

      - name: Put chez on PATH
        run: |
          # Installed as `scheme`; the gate invokes `chez`. A wrapper that execs
          # scheme keeps argv0 so Chez finds its boot files. Placed next to scheme
          # so build.ss derives the csv dir (libkernel.a/scheme.h) from it.
          printf '#!/bin/sh\nexec /opt/chez/bin/scheme "$@"\n' > /opt/chez/bin/chez
          chmod +x /opt/chez/bin/chez
          echo '/opt/chez/bin' >> "$GITHUB_PATH"
          /opt/chez/bin/chez --version

      - name: Install JDK + Clojure (certify oracle)
        run: |
          sudo apt-get install -y default-jdk rlwrap
          # --retry + --fail so a transient CDN error retries instead of handing
          # bash an HTML error page (a 2min timeout page flaked a run)
          curl --fail --retry 5 --retry-delay 10 --retry-all-errors -L -O \
            https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          head -1 linux-install.sh | grep -q '^#!' || { echo "installer download corrupt"; cat linux-install.sh | head -5; exit 1; }
          sudo bash linux-install.sh
          clojure --version

      - name: Gate
        # `make test` = the self-host byte-fixpoint (the rebuilt seed must equal
        # the checked-in seed byte-for-byte — holds cross-platform on the pinned
        # source-built Chez) + the behavior gates (`make ci`: corpus/unit/smoke/
        # buildsmoke/sci/certify). buildsmoke links a real binary (the source
        # build ships the kernel dev files).
        # -j overlaps the independent gates (ci is a plain dependency list);
        # -Oline keeps per-recipe output contiguous for failure reading.
        run: make -j"$(nproc)" -Oline test

  # The normal behavior gate is intentionally Linux-only, but dependency
  # subprocesses cross a different host boundary on native Windows: Chez starts
  # cmd.exe while jolt.host promises POSIX sh semantics. Build the packaged
  # compiler and exercise the transactional cache on every push/PR so that path
  # cannot regress unnoticed until a release tag.
  git-deps-windows:
    name: packaged Git deps (Windows x86_64)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            git make vim
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-lz4
            mingw-w64-x86_64-zlib

      - name: Cache Chez Scheme
        id: cache-chez-win
        uses: actions/cache@v4
        with:
          path: chez-install
          key: chez-${{ runner.os }}-v10.4.1-mingw64

      - name: Build Chez Scheme from source
        if: steps.cache-chez-win.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v10.4.1 https://github.com/cisco/ChezScheme.git /tmp/chez-src
          cd /tmp/chez-src
          ./configure --threads
          make -j"$(nproc)"
          inst="$GITHUB_WORKSPACE/chez-install"
          mkdir -p "$inst/bin" "$inst/csv"
          cp ta6nt/bin/ta6nt/*.exe "$inst/bin/"
          cp ta6nt/bin/ta6nt/*.dll "$inst/bin/" 2>/dev/null || true
          cp ta6nt/boot/ta6nt/petite.boot ta6nt/boot/ta6nt/scheme.boot "$inst/bin/"
          cp ta6nt/boot/ta6nt/petite.boot ta6nt/boot/ta6nt/scheme.boot "$inst/csv/"
          cp ta6nt/boot/ta6nt/scheme.h "$inst/csv/"
          cp ta6nt/boot/ta6nt/equates.h "$inst/csv/" 2>/dev/null || true
          cp ta6nt/boot/ta6nt/libkernel.a "$inst/csv/"

      - name: Put Chez and cc on PATH
        run: |
          bindir="$GITHUB_WORKSPACE/chez-install/bin"
          { echo '#!/bin/sh'; echo "exec \"$bindir/scheme.exe\" \"\$@\""; } > "$bindir/chez"
          { echo '#!/bin/sh'; echo 'exec gcc "$@"'; } > "$bindir/cc"
          chmod +x "$bindir/chez" "$bindir/cc"
          echo "$bindir" >> "$GITHUB_PATH"
          echo "JOLT_CHEZ_CSV=$GITHUB_WORKSPACE/chez-install/csv" >> "$GITHUB_ENV"

      # This is deliberately source-mode. It covers the native Windows runtime
      # even though the current self-contained compiler still uses the separate
      # MinGW/libkernel.a packaging contract below.
      - name: Native Windows source-mode core gate
        env:
          JOLT_SH: C:/Program Files/Git/bin/sh.exe
          TMPDIR: ${{ runner.temp }}
        run: |
          chez --script test/chez/target-descriptor-test.ss
          chez --script test/chez/build-output-test.ss
          chez --script host/chez/run-unit.ss
          chez --script host/chez/cli.ss run test/mvn_http_test.clj

      - name: Build packaged joltc
        run: |
          chez --version
          make joltc-release

      - name: Packaged Windows POSIX-shell boundary
        run: |
          shell_tmp="$RUNNER_TEMP/jolt shell temp"
          mkdir -p "$shell_tmp"
          shell_tmp_win="$(cygpath -w "$shell_tmp")"
          JOLT_SH='C:/Program Files/Git/bin/sh.exe' \
            TEMP="$shell_tmp_win" TMP="$shell_tmp_win" \
            ./target/release/joltc run test/windows_shell_test.clj

      - name: Transactional Git dependency cache
        run: make depstest DEPSTEST_JOLTC=./target/release/joltc

  # Windows ARM64 currently has no GNU/libkernel.a package lane. That must not
  # hide native source-runtime regressions. Build the exact Chez release with
  # its supported MSVC ARM64 target and run the core source gates directly.
  # The runner image is still in public preview, so this job initially records
  # evidence without making an image outage block the established gates.
  windows-arm64-source:
    name: source runtime (Windows aarch64 preview)
    runs-on: windows-11-vs2026-arm
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Checkout Chez Scheme v10.4.1
        uses: actions/checkout@v5
        with:
          repository: cisco/ChezScheme
          ref: v10.4.1
          submodules: recursive
          path: chez-src

      - name: Build native ARM64 Chez Scheme
        shell: cmd
        working-directory: chez-src
        run: build.bat tarm64nt /only

      - name: Native Windows ARM64 source-mode core gate
        shell: pwsh
        env:
          HOME: ${{ runner.temp }}
          JOLT_SH: C:/Program Files/Git/bin/sh.exe
          TMPDIR: ${{ runner.temp }}
        run: |
          $chez = Join-Path $env:GITHUB_WORKSPACE 'chez-src\tarm64nt\bin\tarm64nt\scheme.exe'
          if (-not (Test-Path $chez)) {
            throw "Chez ARM64 executable not found: $chez"
          }
          & $chez --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $chez --script test\chez\target-descriptor-test.ss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $chez --script host\chez\run-unit.ss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:JOLT_PWD = $env:GITHUB_WORKSPACE
          & $chez --script host\chez\cli.ss run test\mvn_http_test.clj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $chez --script host\chez\cli.ss run test\windows_shell_test.clj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
