name: tests

# Run the gate (make test) on every push and pull request. Chez is the sole
# substrate; the JVM is used only as the conformance oracle (certify).
on:
  push:
  pull_request:

permissions:
  contents: read

# The shared, immutable Chez CI toolchain. Every job pins the action revision
# AND the archive digest, so nothing here depends on a mutable tag. The action
# validates the digest, the archive's internal inventory, the required
# capability files, the Chez version and the machine type, and only then
# exports CHEZ, JOLT_CHEZ, JOLT_CHEZ_CSV and PATH. Those four exports are the
# whole contract: this workflow never reconstructs the install layout.
env:
  CHEZ_TOOLCHAIN_RELEASE: chez-ci-10.4.1.1

jobs:
  test:
    name: full gate (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            toolchain-target: linux-x86_64
            toolchain-sha256: 16476cd98fb5cb2e2c0285e88fcd6d57ade9392ca8d7cf603ca38432b4118526
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            toolchain-target: linux-aarch64
            toolchain-sha256: b5b2306d3d6468b5fc7d5836721b09c704c7750f887a6232f1aeeb567d55f5d9
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          submodules: recursive   # vendor/irregex, used by the Chez regex shim

      # Not Chez itself — these are the C toolchain and the libraries Chez's
      # kernel links against, which `jolt build` (the buildsmoke gate) needs to
      # link a standalone binary out of libkernel.a.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git liblz4-dev zlib1g-dev libncurses-dev uuid-dev

      # gnu-kernel-dev is what makes buildsmoke link a real binary instead of
      # skipping: the distro chezscheme package ships petite+scheme only, with
      # no libkernel.a/scheme.h.
      - name: Install Chez Scheme (shared toolchain)
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@095108ae32659757808064d004855092567d3ad3
        with:
          target: ${{ matrix.toolchain-target }}
          release-tag: ${{ env.CHEZ_TOOLCHAIN_RELEASE }}
          sha256: ${{ matrix.toolchain-sha256 }}
          capabilities: source-runtime,gnu-kernel-dev

      - name: Chez toolchain evidence
        run: |
          echo "target:        ${{ steps.chez.outputs.target }}"
          echo "archive sha256: ${{ steps.chez.outputs.archive-sha256 }}"
          echo "cache-hit:     ${{ steps.chez.outputs.cache-hit }}"
          echo "root:          ${{ steps.chez.outputs.root }}"
          echo "CHEZ=$CHEZ"
          echo "JOLT_CHEZ_CSV=$JOLT_CHEZ_CSV"
          "$CHEZ" --version
          command -v chez
          command -v cc
          # Fail closed here rather than letting buildsmoke quietly skip later.
          for f in scheme.h libkernel.a petite.boot scheme.boot; do
            test -f "$JOLT_CHEZ_CSV/$f" || { echo "missing kernel dev file: $f"; exit 1; }
          done

      - name: Install JDK + Clojure (certify oracle)
        run: |
          sudo apt-get install -y default-jdk rlwrap
          # --retry + --fail so a transient CDN error retries instead of handing
          # bash an HTML error page (a 2min timeout page flaked a run)
          curl --fail --retry 5 --retry-delay 10 --retry-all-errors -L -O \
            https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          head -1 linux-install.sh | grep -q '^#!' || { echo "installer download corrupt"; cat linux-install.sh | head -5; exit 1; }
          sudo bash linux-install.sh
          clojure --version

      - name: Gate
        # `shell: bash` (not the implicit `bash -e`) so pipefail is on and the
        # tee below cannot mask a failing make.
        shell: bash
        # `make test` = the self-host byte-fixpoint (the rebuilt seed must equal
        # the checked-in seed byte-for-byte — holds cross-platform on the pinned
        # Chez 10.4.1 built with --threads --disable-x11, which is exactly what
        # the shared toolchain ships) + the behavior gates (`make ci`: corpus/
        # unit/smoke/buildsmoke/sci/certify).
        # -j overlaps the independent gates (ci is a plain dependency list);
        # -Oline keeps per-recipe output contiguous for failure reading.
        # Teed so the next step can prove buildsmoke did not take its skip path.
        run: make -j"$(nproc)" -Oline test 2>&1 | tee "$RUNNER_TEMP/gate.log"

      - name: Assert buildsmoke linked a real binary
        run: |
          log="$RUNNER_TEMP/gate.log"
          if grep -q 'build smoke: skipped' "$log"; then
            echo "FAIL: buildsmoke skipped — gnu-kernel-dev was not actually consumed"
            exit 1
          fi
          grep -q 'build smoke: passed' "$log" || {
            echo "FAIL: buildsmoke did not report a pass"; exit 1; }
          echo "buildsmoke consumed gnu-kernel-dev and linked a binary"

  # The normal behavior gate is intentionally Linux-only, but dependency
  # subprocesses cross a different host boundary on native Windows: Chez starts
  # cmd.exe while jolt.host promises POSIX sh semantics. Build the packaged
  # compiler and exercise the transactional cache on every push/PR so that path
  # cannot regress unnoticed until a release tag.
  git-deps-windows:
    name: packaged Git deps (Windows x86_64)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          submodules: recursive

      # MSYS2 stays: it supplies the POSIX shell the gate's recipes and
      # jolt.host semantics assume, plus the MinGW GNU compiler and the lz4/zlib
      # import libraries the packaged binary links against. It no longer builds
      # Chez.
      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            git make vim
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-lz4
            mingw-w64-x86_64-zlib

      - name: Install Chez Scheme (shared toolchain)
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@095108ae32659757808064d004855092567d3ad3
        with:
          target: windows-x86_64
          release-tag: ${{ env.CHEZ_TOOLCHAIN_RELEASE }}
          sha256: 360c60496eea2f8aab0e557eb77e9e18b315bb9181938158ae57655aa541b7f8
          capabilities: source-runtime,gnu-kernel-dev

      # The action exports native Windows paths. JOLT_CHEZ_CSV is read by Chez
      # itself (build.ss does file-exists? natively), so it stays native. CHEZ /
      # JOLT_CHEZ are resolved through the POSIX shell — make invokes $(CHEZ)
      # from an MSYS2 recipe and build.ss runs `command -v "$JOLT_CHEZ"` under
      # sh — so those two, and only those two, are translated here.
      - name: Translate toolchain paths for the POSIX shell
        run: |
          chez_posix="$(cygpath -u "$CHEZ")"
          test -x "$chez_posix"
          echo "CHEZ=$chez_posix" >> "$GITHUB_ENV"
          echo "JOLT_CHEZ=$chez_posix" >> "$GITHUB_ENV"

      - name: Chez toolchain evidence
        run: |
          echo "target:         ${{ steps.chez.outputs.target }}"
          echo "archive sha256: ${{ steps.chez.outputs.archive-sha256 }}"
          echo "cache-hit:      ${{ steps.chez.outputs.cache-hit }}"
          echo "CHEZ=$CHEZ"
          echo "JOLT_CHEZ_CSV=$JOLT_CHEZ_CSV"
          "$CHEZ" --version
          # `cc` comes from the archive's gnu-kernel-dev capability (it execs the
          # MinGW gcc installed above); the Makefile/build.ss only ever look for
          # the name `cc`, so no shim is recreated here.
          command -v cc
          csv_posix="$(cygpath -u "$JOLT_CHEZ_CSV")"
          for f in scheme.h libkernel.a petite.boot scheme.boot; do
            test -f "$csv_posix/$f" || { echo "missing kernel dev file: $f"; exit 1; }
          done

      # This is deliberately source-mode. It covers the native Windows runtime
      # even though the current self-contained compiler still uses the separate
      # MinGW/libkernel.a packaging contract below.
      - name: Native Windows source-mode core gate
        env:
          JOLT_SH: C:/Program Files/Git/bin/sh.exe
          TMPDIR: ${{ runner.temp }}
        run: |
          "$CHEZ" --script test/chez/target-descriptor-test.ss
          "$CHEZ" --script test/chez/build-output-test.ss
          "$CHEZ" --script host/chez/run-unit.ss
          "$CHEZ" --script test/chez/timed-deref-deadline-test.ss
          "$CHEZ" --script host/chez/cli.ss run test/mvn_http_test.clj

      # HK0B moved every ranged read-array!/write-array onto one memmove through
      # a locked interior pointer, so the Windows CRT and the Windows
      # continuation/unwind behavior are now load-bearing for the FFI. Neither
      # is observable from Linux. Source mode is sufficient: this exercises the
      # real memmove symbol and real native memory.
      #
      # The gate is not trusted on its printed text. It is run without a pipe so
      # the child's real exit status survives, and the pass line is then required
      # explicitly: the script skips ten POSIX-only checks on Windows (fcntl and
      # POSIX errno semantics, which jolt.ffi deliberately does not provide
      # there) and fails closed on its own check floor, so a silently shrinking
      # Windows gate cannot report success.
      - name: HK0B ranged FFI gate
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          log="$RUNNER_TEMP/hk0b-ffi-binding.log"
          set +e
          "$CHEZ" --script test/chez/ffi-binding-test.ss >"$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          echo "ffi-binding-test child exit: $rc"
          [ "$rc" -eq 0 ] || exit "$rc"
          grep -qx '60/60 passed' "$log" || {
            echo "the Windows FFI gate did not run its full check set"; exit 1; }
          alloc="$RUNNER_TEMP/hk0b-ffi-alloc.log"
          set +e
          "$CHEZ" --script test/chez/ffi-ranged-copy-alloc-bench.ss >"$alloc" 2>&1
          arc=$?
          set -e
          cat "$alloc"
          echo "ffi-ranged-copy-alloc-bench child exit: $arc"
          [ "$arc" -eq 0 ] || exit "$arc"
          grep -q '0 gated failures' "$alloc" || {
            echo "the ranged allocation gate did not report its verdict"; exit 1; }

      - name: Build packaged jolt
        run: |
          "$CHEZ" --version
          make jolt-release
          test -x target/release/jolt

      - name: Packaged Windows POSIX-shell boundary
        run: |
          shell_tmp="$RUNNER_TEMP/jolt shell temp"
          mkdir -p "$shell_tmp"
          shell_tmp_win="$(cygpath -w "$shell_tmp")"
          JOLT_SH='C:/Program Files/Git/bin/sh.exe' \
            TEMP="$shell_tmp_win" TMP="$shell_tmp_win" \
            ./target/release/jolt run test/windows_shell_test.clj

      # The self-contained half of HK0B: read-array/read-array!/write-array and
      # with-byte-array-pointer are host vars, so a tree shake that dropped one
      # would silently degrade the FFI in a packaged binary rather than fail to
      # build. shakelocal builds each fixture twice and requires identical
      # output. It deliberately exits 0 with a "skipped" line when the Chez
      # kernel-dev files or `cc` are missing, which is right on a distro Chez but
      # indistinguishable from a pass here — so require the passed line.
      - name: HK0B tree-shake transfer fixture
        run: |
          log="$RUNNER_TEMP/hk0b-shakelocal.log"
          set +e
          make shakelocal JOLT_BIN=./target/release/jolt >"$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          echo "shakelocal child exit: $rc"
          if ! grep -q 'shake smoke: passed' "$log"; then
            # run_local_case passes an ABSOLUTE app dir as JOLT_PWD; reproduce
            # that exactly, then the same thing with a native Windows path, to
            # separate "POSIX path not understood by the Win32 binary" from a
            # genuine build failure.
            app="$PWD/test/chez/ffi-transfer-app"
            echo "--- diagnostic A: absolute POSIX JOLT_PWD (as run_local_case) ---"
            echo "JOLT_PWD=$app"
            set +e
            JOLT_PWD="$app" ./target/release/jolt build \
              -m app.core -o "$RUNNER_TEMP/ffi-transfer-diagA"
            echo "diagnostic A exit: $?"
            echo "--- diagnostic B: native Windows JOLT_PWD ---"
            app_win="$(cygpath -w "$app")"
            echo "JOLT_PWD=$app_win"
            JOLT_PWD="$app_win" ./target/release/jolt build \
              -m app.core -o "$(cygpath -w "$RUNNER_TEMP")\\ffi-transfer-diagB.exe"
            echo "diagnostic B exit: $?"
            set -e
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          grep -q 'shake smoke: skipped' "$log" && {
            echo "tree-shake smoke skipped; it must run on this job"; exit 1; }
          grep -q 'shake smoke: passed' "$log" || {
            echo "tree-shake smoke did not report a pass"; exit 1; }

      - name: Transactional Git dependency cache
        run: make depstest DEPSTEST_JOLTC=./target/release/jolt

  # Windows ARM64 currently has no GNU/libkernel.a package lane — the shared
  # toolchain deliberately publishes only `source-runtime` there, so this job
  # makes no packaged joltc/AOT/kernel-dev claim. That must not hide native
  # source-runtime regressions, so run the core source gates directly against
  # the pinned native ARM64 (tarm64nt) archive. The runner image is still in
  # public preview, so this job continues to record evidence without making an
  # image outage block the established gates.
  windows-arm64-source:
    name: source runtime (Windows aarch64 preview)
    runs-on: windows-11-vs2026-arm
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          submodules: recursive

      - name: Install Chez Scheme (shared toolchain)
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@095108ae32659757808064d004855092567d3ad3
        with:
          target: windows-arm64
          release-tag: ${{ env.CHEZ_TOOLCHAIN_RELEASE }}
          sha256: 9bc28462823a1447de6d849e129758a6317cc9deafb8e87414817e7244f149c8
          capabilities: source-runtime

      - name: Native Windows ARM64 source-mode core gate
        shell: pwsh
        env:
          HOME: ${{ runner.temp }}
          JOLT_SH: C:/Program Files/Git/bin/sh.exe
          TMPDIR: ${{ runner.temp }}
        run: |
          Write-Host "target:         ${{ steps.chez.outputs.target }}"
          Write-Host "archive sha256: ${{ steps.chez.outputs.archive-sha256 }}"
          Write-Host "cache-hit:      ${{ steps.chez.outputs.cache-hit }}"
          $chez = $env:CHEZ
          if (-not (Test-Path $chez)) {
            throw "Chez ARM64 executable not found: $chez"
          }
          & $chez --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Native target evidence: this must be the ARM64 Chez, not an x64 one
          # running under emulation.
          $probe = Join-Path $env:RUNNER_TEMP 'machine-type.ss'
          Set-Content -LiteralPath $probe -Value '(display (machine-type))(newline)'
          $machine = (& $chez --script $probe | Select-Object -First 1).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "machine-type:   $machine"
          if ($machine -ne 'tarm64nt') {
            throw "expected native tarm64nt Chez, got '$machine'"
          }

          & $chez --script test\chez\target-descriptor-test.ss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $chez --script host\chez\run-unit.ss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $chez --script test\chez\timed-deref-deadline-test.ss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:JOLT_PWD = $env:GITHUB_WORKSPACE
          & $chez --script host\chez\cli.ss run test\mvn_http_test.clj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $chez --script host\chez\cli.ss run test\windows_shell_test.clj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The ARM64 half of the HK0B evidence. This is the only lane that observes
      # the ranged interior-pointer transfer, its memmove resolution, and the
      # retired-scope re-entry refusal under the Windows ARM64 ABI and unwinder.
      # The machine-type assertion above already proved this Chez is native
      # tarm64nt rather than x64 under emulation, so these results are ARM64
      # results.
      #
      # $LASTEXITCODE is checked after every child, and the pass line is then
      # required explicitly, so neither a lost exit status nor a gate that
      # quietly stopped running checks can be read as success. There is no
      # tree-shake or packaged lane here: the ARM64 archive publishes only
      # source-runtime, so a shake smoke would take its documented skip path and
      # prove nothing.
      - name: HK0B ranged FFI gate (ARM64)
        shell: pwsh
        env:
          HOME: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          $chez = $env:CHEZ
          $log = Join-Path $env:RUNNER_TEMP 'hk0b-ffi-binding-arm64.log'
          & $chez --script test\chez\ffi-binding-test.ss *>&1 |
            Tee-Object -FilePath $log
          $rc = $LASTEXITCODE
          Write-Host "ffi-binding-test child exit: $rc"
          if ($rc -ne 0) { exit $rc }
          if (-not (Select-String -LiteralPath $log -Pattern '^60/60 passed$' -Quiet)) {
            throw "the Windows ARM64 FFI gate did not run its full check set"
          }

          $alloc = Join-Path $env:RUNNER_TEMP 'hk0b-ffi-alloc-arm64.log'
          & $chez --script test\chez\ffi-ranged-copy-alloc-bench.ss *>&1 |
            Tee-Object -FilePath $alloc
          $arc = $LASTEXITCODE
          Write-Host "ffi-ranged-copy-alloc-bench child exit: $arc"
          if ($arc -ne 0) { exit $arc }
          if (-not (Select-String -LiteralPath $alloc -Pattern '0 gated failures' -Quiet)) {
            throw "the ranged allocation gate did not report its verdict"
          }
