name: durable runtime artifact

# This is a selected plain-runtime capability artifact, not the aspect branch gate.
# Historical paired artifacts remain unchanged in their authenticated producer runs;
# do not rebuild unchanged historical sources whenever this workflow advances.
# Changing this workflow does not change the compiler source built below.
# The filtered canonical push produces an artifact after reviewed workflow
# changes merge. Dispatch is available only when GitHub registers the workflow;
# the fork's default branch is main, not integration/aspects.
on:
  push:
    branches: [integration/aspects]
    paths: [.github/workflows/durable-runtime-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durable-runtime-artifact
  cancel-in-progress: false

jobs:
  runtime:
    name: runtime (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Never run two full compiler gates concurrently or cancel the other
      # source's evidence when one element fails.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - label: collector-sorted-dispatch
            compiler_source: 7c57cf7e5bca789efe31706d4f9830df8a08306a
            compiler_tree: d5dca7ebaba66cf429d2c63219026b8415675dec
            artifact_name: durable-runtime-7c57cf7e-linux-x64
    env:
      COMPILER_SOURCE: ${{ matrix.compiler_source }}
      COMPILER_TREE: ${{ matrix.compiler_tree }}
      CHEZ: /opt/chez/bin/chez
      CHEZSCHEME: /opt/chez/bin/chez
      JOLT_CHEZ: /opt/chez/bin/chez
      JOLT_CHEZ_CSV: /opt/chez/lib/csv10.4.1/ta6le
      JOLT_NO_USER_DEPS: "1"
    defaults:
      run:
        shell: bash
        working-directory: compiler
    steps:
      - uses: actions/checkout@v5
        with:
          repository: casselc/jolt
          ref: ${{ matrix.compiler_source }}
          path: compiler
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify selected plain compiler source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMPILER_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$COMPILER_TREE"
          test -z "$(git status --porcelain)"
          # Workflow custody is canonical, but this source has no aspect fork.
          # Do not claim aspect integration provenance for a plain runtime.

      # Same source-built PIC Chez setup as tests.yml, needed by build-lib-smoke.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git liblz4-dev zlib1g-dev libncurses-dev uuid-dev default-jdk rlwrap

      - name: Cache Chez Scheme
        id: cache-chez
        uses: actions/cache@v4
        with:
          path: /opt/chez
          key: chez-${{ runner.os }}-${{ env.ImageOS }}-v10.4.1-x11off-pic

      - name: Build Chez Scheme from source
        if: steps.cache-chez.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v10.4.1 https://github.com/cisco/ChezScheme.git /tmp/chez-src
          cd /tmp/chez-src
          ./configure --installprefix=/opt/chez --threads --disable-x11 CFLAGS+=-fPIC
          make -j"$(nproc)"
          sudo make install
          sudo chown -R "$USER" /opt/chez

      - name: Select and verify Chez 10.4.1
        run: |
          set -euo pipefail
          printf '#!/bin/sh\nexec /opt/chez/bin/scheme "$@"\n' > /opt/chez/bin/chez
          chmod +x /opt/chez/bin/chez
          echo '/opt/chez/bin' >> "$GITHUB_PATH"
          test "$(/opt/chez/bin/chez --version 2>&1)" = '10.4.1'

      - name: Install Clojure certification oracle
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 10 --retry-all-errors -L -o linux-install.sh \
            https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          head -1 linux-install.sh | grep -q '^#!'
          sudo bash linux-install.sh
          echo 'JAVA_CMD=/usr/lib/jvm/default-java/bin/java' >> "$GITHUB_ENV"
          echo 'JAVA_HOME=/usr/lib/jvm/default-java' >> "$GITHUB_ENV"

      - name: Full compiler CI gate and shared standalone build
        env:
          JOLT_REQUIRE_BUILDLIB: "1"
        # ci omits only the seed-minting self-host byte fixpoint; capability and
        # build-library gates remain required. Bound parallel jobs/memory use.
        run: make CHEZ=/opt/chez/bin/chez -j2 -Oline ci

      - name: Require exact ranged-append capability
        run: |
          set -euo pipefail
          timeout --kill-after=5s 30s target/release/jolt -Srepro -e '
            (let [out (java.io.ByteArrayOutputStream.)
                  writer (java.io.OutputStreamWriter. out "UTF-8")]
              (.append writer "abc" 1 2)
              (.flush writer)
              (assert (= [98] (vec (.toByteArray out))))
              (println :ranged-append-capability-pass))'

      - name: Require standalone fixed-vector constructor capability
        run: |
          set -euo pipefail
          timeout --kill-after=5s 30s target/release/jolt -Srepro -e '
            (require (quote [jolt.scheme :as scheme]))
            (let [body "(let ()
                   (define (old . xs) (make-pvec (list->vector xs)))
                   (define (allocated f)
                     (collect)
                     (let ((before (sstats-bytes (statistics))))
                       (do ((i 0 (+ i 1))) ((= i 100000)) (f i #f))
                       (- (sstats-bytes (statistics)) before)))
                   (let ((old-bytes (allocated old))
                         (new-bytes (allocated jolt-vector)))
                     (< new-bytes (* old-bytes 0.95))))"
                  positive (scheme/eval-string body)
                  negative (scheme/eval-string
                             (str "(let ((jolt-vector (lambda xs (make-pvec (list->vector xs))))) "
                                  body ")"))]
              (assert positive)
              (assert (false? negative))
              (println :fixed-vector-constructor-capability-pass :old-body-control-rejected))'

      - name: Require sorted dispatch source and built allocation capabilities
        run: |
          set -euo pipefail
          timeout --kill-after=5s 60s /opt/chez/bin/chez --script test/chez/sorted-op-dispatch-test.ss
          timeout --kill-after=5s 30s target/release/jolt -Srepro -e '
            (require (quote [jolt.host :as host]) (quote [jolt.scheme :as scheme]))
            (let [codes (sorted-map :absent 1 :historical-untyped 0 :invalid 4
                                    :present-empty 2 :valid 3)
                  run (fn [] (loop [i 0 sum 0]
                               (if (= i 20000) sum
                                 (recur (inc i) (+ sum (get codes :valid))))))
                  allocated (fn []
                              (dotimes [_ 3] (assert (= 60000 (run))))
                              (let [before (+ (host/gc-bytes) (host/bytes-allocated))]
                                (dotimes [_ 20] (assert (= 60000 (run))))
                                (/ (- (+ (host/gc-bytes) (host/bytes-allocated)) before) 20.0)))
                  [install-old restore]
                  (scheme/eval-string
                    "(let ((saved sc-call))
                       (jolt-vector
                         (lambda () (set! sc-call
                           (lambda (sc op . args) (apply jolt-invoke (sc-op sc op) sc args))))
                         (lambda () (set! sc-call saved))))")]
              (assert (< (allocated) 8192))
              (try
                (install-old)
                (assert (> (allocated) 65536))
                (finally (restore)))
              (assert (< (allocated) 8192))
              (println :sorted-dispatch-capability-pass :old-body-control-rejected))'

      - name: Verify built source remains unchanged
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMPILER_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$COMPILER_TREE"
          git diff --exit-code
          git diff --cached --exit-code
          # Build caches may be untracked; tracked source and submodule commits
          # must still match the selected source, including nested modules.
          submodules="$(git submodule status --recursive)"
          if grep -E '^[+-U]' <<< "$submodules"; then exit 1; fi
          git submodule foreach --recursive 'git diff --exit-code && git diff --cached --exit-code'

      - name: Package binary and allowlisted build provenance
        env:
          WORKFLOW_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ../runtime-artifact
          cp target/release/jolt ../runtime-artifact/jolt
          {
            printf 'schema=1\nrepository=casselc/jolt\ncompiler_flavor=plain\n'
            printf 'compiler_source=%s\n' "$COMPILER_SOURCE"
            printf 'compiler_tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'workflow_source=%s\n' "$WORKFLOW_SOURCE"
            printf 'workflow_path=.github/workflows/durable-runtime-artifact.yml\n'
            printf 'run_id=%s\nrun_attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'runner_os=%s\nrunner_arch=%s\nimage_os=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS"
            printf 'image_version=%s\n' "${ImageVersion:-unavailable}"
            printf 'chez_version=%s\n' "$(/opt/chez/bin/chez --version 2>&1)"
            printf 'chez_sha256=%s\n' "$(sha256sum /opt/chez/bin/scheme | cut -d ' ' -f 1)"
            printf 'cc_version=%s\n' "$(cc --version | head -1)"
            printf 'cc_sha256=%s\n' "$(sha256sum "$(readlink -f "$(command -v cc)")" | cut -d ' ' -f 1)"
            printf 'build_command=make CHEZ=/opt/chez/bin/chez -j2 -Oline ci\n'
            printf 'chez_configure=--threads --disable-x11 CFLAGS+=-fPIC\n'
            printf 'require_buildlib=1\n'
            printf 'binary_version=%s\n' "$(target/release/jolt --version)"
            printf 'binary_sha256=%s\n' "$(sha256sum target/release/jolt | cut -d ' ' -f 1)"
            printf 'gate=ci-pass\nranged_append_ascii=98\nfixed_vector_constructor=pass\nfixed_vector_constructor_control=old-rejected\n'
            printf 'sorted_dispatch_allocation=pass\nsorted_dispatch_control=old-rejected\n'
            printf 'submodules_begin\n'
            git submodule status --recursive
            printf 'submodules_end\n'
          } > ../runtime-artifact/build-manifest.txt
          (cd ../runtime-artifact && sha256sum jolt build-manifest.txt > SHA256SUMS)

      - name: Upload immutable capability runtime
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: runtime-artifact/
          if-no-files-found: error
          retention-days: 90

      # Artifact availability is temporary, not a permanent fork release.
      # Consumers must fail closed if this pinned artifact expires and rotate
      # only after reviewing/qualifying a new run and digest. ZIP downloads lose
      # executable mode: consumers verify bytes first, then chmod the binary.

      - name: Record artifact identity for pinned consumers
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          printf 'Compiler source: `%s`\n\nWorkflow source: `%s`\n\nRun: `%s` attempt `%s`\n\nArtifact ID: `%s`\n\nArtifact SHA256: `%s`\n' \
            "$COMPILER_SOURCE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
