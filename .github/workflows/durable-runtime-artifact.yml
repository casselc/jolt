name: measured durable runtime artifact

# Exact bare-runtime capability producer, not an aspect-compiler qualification.
# Compiler source is independent of the workflow source and never follows HEAD.
on:
  push:
    branches: [ci/measured-runtime-ab9b-20261007]
    paths: [.github/workflows/durable-runtime-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measured-durable-runtime-ab9b
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPILER_SOURCE: bcb376a04f8e3d4508e9f77f4fa33b50bae7924b
      COMPILER_TREE: eb24fdfdba7da4e468304376e37db3117b3c50b9
      UPSTREAM_SOURCE: 58980ac9faa6c3c571d1cb251eb7b09799af1b67
      UPSTREAM_TREE: 1cf36cb0fed53401364d05f2b9e74a9cc25edaa6
      CHEZ: /opt/chez/bin/chez
      JOLT_NO_USER_DEPS: "1"
    defaults:
      run:
        shell: bash
        working-directory: compiler
    steps:
      - uses: actions/checkout@v5
        with:
          repository: casselc/jolt
          ref: bcb376a04f8e3d4508e9f77f4fa33b50bae7924b
          path: compiler
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Verify exact source, tree and released upstream ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMPILER_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$COMPILER_TREE"
          # Fork refs need not contain upstream release tags. Fetch this exact
          # tag read-only, without force; verify its pinned objects below before
          # it can supply the version label used by the build.
          git fetch --no-tags https://github.com/jolt-lang/jolt.git refs/tags/v0.8.17:refs/tags/v0.8.17
          test "$(git rev-parse v0.8.17^{commit})" = "$UPSTREAM_SOURCE"
          test "$(git rev-parse v0.8.17^{tree})" = "$UPSTREAM_TREE"
          git merge-base --is-ancestor "$UPSTREAM_SOURCE" "$COMPILER_SOURCE"
          test -z "$(git status --porcelain)"
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential git liblz4-dev zlib1g-dev libncurses-dev uuid-dev default-jdk rlwrap
          echo "CI_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
      - name: Cache Chez Scheme
        id: cache-chez
        uses: actions/cache@v4
        with:
          path: /opt/chez
          key: chez-${{ runner.os }}-${{ env.ImageOS }}-v10.4.1-x11off-pic
      - name: Build Chez Scheme from source
        if: steps.cache-chez.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v10.4.1 https://github.com/cisco/ChezScheme.git /tmp/chez-src
          cd /tmp/chez-src
          ./configure --installprefix=/opt/chez --threads --disable-x11 CFLAGS+=-fPIC
          make -j"$(nproc)"
          sudo make install
          sudo chown -R "$USER" /opt/chez
      - name: Select and verify Chez 10.4.1
        run: |
          set -euo pipefail
          printf '#!/bin/sh\nexec /opt/chez/bin/scheme "$@"\n' > /opt/chez/bin/chez
          chmod +x /opt/chez/bin/chez
          echo '/opt/chez/bin' >> "$GITHUB_PATH"
          test "$(/opt/chez/bin/chez --version 2>&1)" = '10.4.1'
      - name: Install Clojure certification oracle
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 10 --retry-all-errors -L -o linux-install.sh \
            https://github.com/clojure/brew-install/releases/download/1.12.6.1673/linux-install.sh
          printf '%s  %s\n' 5ae63b082ed33bf4c29bf1a8317c5c15249d1bc753676b2f5177fb3804ad6f77 linux-install.sh | sha256sum -c -
          # This exact script also checks its exact CLI archive before extraction.
          # Install into runner-owned space; the oracle bootstrap needs no root.
          bash linux-install.sh --prefix "$RUNNER_TEMP/clojure-oracle"
          echo "$RUNNER_TEMP/clojure-oracle/bin" >> "$GITHUB_PATH"
          echo 'JAVA_CMD=/usr/lib/jvm/default-java/bin/java' >> "$GITHUB_ENV"
          echo 'JAVA_HOME=/usr/lib/jvm/default-java' >> "$GITHUB_ENV"
      - name: Full behavioral CI gate and shared standalone build
        env:
          JOLT_REQUIRE_BUILDLIB: "1"
        # CI excludes the dev-only selfhost byte-fixpoint (seed Chez dependent),
        # not behavioral/compiler/library gates. Require shared-build coverage.
        run: make CHEZ=/opt/chez/bin/chez -j"$CI_BUILD_JOBS" -Oline ci
      - name: Require selected version and ranged-append capability
        run: |
          set -euo pipefail
          test "$(target/release/jolt --version)" = 'jolt v0.8.17-39-gbcb376a0'
          timeout 30s target/release/jolt -Srepro -e '
            (let [out (java.io.ByteArrayOutputStream.)
                  writer (java.io.OutputStreamWriter. out "UTF-8")]
              (.append writer "abc" 1 2)
              (.flush writer)
              (assert (= [98] (vec (.toByteArray out))))
              (println :ranged-append-capability-pass))'
      - name: Verify built source remains unchanged
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMPILER_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$COMPILER_TREE"
          git diff --exit-code
          git diff --cached --exit-code
          submodules="$(git submodule status --recursive)"
          if grep -E '^[+-U]' <<< "$submodules"; then exit 1; fi
          git submodule foreach --recursive 'git diff --exit-code && git diff --cached --exit-code'
      - name: Package binary and allowlisted build provenance
        env:
          WORKFLOW_SOURCE: ${{ github.sha }}
          CHEZ_CACHE_HIT: ${{ steps.cache-chez.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p ../runtime-artifact
          cp target/release/jolt ../runtime-artifact/jolt
          {
            printf 'schema=1\nrepository=casselc/jolt\n'
            printf 'compiler_source=%s\ncompiler_tree=%s\n' "$COMPILER_SOURCE" "$COMPILER_TREE"
            printf 'upstream_source=%s\nupstream_tree=%s\n' "$UPSTREAM_SOURCE" "$UPSTREAM_TREE"
            printf 'workflow_source=%s\n' "$WORKFLOW_SOURCE"
            printf 'workflow_path=.github/workflows/durable-runtime-artifact.yml\n'
            printf 'run_id=%s\nrun_attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'runner_os=%s\nrunner_arch=%s\nimage_os=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS"
            printf 'image_version=%s\n' "${ImageVersion:-unavailable}"
            printf 'chez_version=%s\n' "$(/opt/chez/bin/chez --version 2>&1)"
            printf 'chez_sha256=%s\n' "$(sha256sum /opt/chez/bin/scheme | cut -d ' ' -f 1)"
            printf 'cc_version=%s\n' "$(cc --version | head -1)"
            printf 'cc_sha256=%s\n' "$(sha256sum "$(readlink -f "$(command -v cc)")" | cut -d ' ' -f 1)"
            printf 'build_command=make CHEZ=/opt/chez/bin/chez -j%s -Oline ci\n' "$CI_BUILD_JOBS"
            printf 'chez_configure=--installprefix=/opt/chez --threads --disable-x11 CFLAGS+=-fPIC\n'
            if [[ "$CHEZ_CACHE_HIT" == true ]]; then printf 'chez_origin=cache\n'; else printf 'chez_origin=source-build\n'; fi
            printf 'clojure_cli_version=1.12.6.1673\n'
            printf 'clojure_installer_sha256=5ae63b082ed33bf4c29bf1a8317c5c15249d1bc753676b2f5177fb3804ad6f77\n'
            printf 'require_buildlib=1\n'
            printf 'binary_version=%s\n' "$(target/release/jolt --version)"
            printf 'binary_sha256=%s\n' "$(sha256sum target/release/jolt | cut -d ' ' -f 1)"
            printf 'gate=pass\nranged_append_ascii=98\nruntime_kind=plain\n'
            printf 'submodules_begin\n'
            git submodule status --recursive
            printf 'submodules_end\n'
          } > ../runtime-artifact/build-manifest.txt
          (cd ../runtime-artifact && sha256sum jolt build-manifest.txt > SHA256SUMS)
      - name: Upload immutable capability runtime
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: durable-runtime-bcb376a0-linux-x64
          path: runtime-artifact/
          if-no-files-found: error
          retention-days: 90
      - name: Record artifact identity for pinned consumers
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          printf 'Compiler source: `%s`\n\nWorkflow source: `%s`\n\nRun: `%s` attempt `%s`\n\nArtifact ID: `%s`\n\nArtifact SHA256: `%s`\n' \
            "$COMPILER_SOURCE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
